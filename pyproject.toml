[project]
name = "codepath-tip102-summer-26"
version = "0.1.0"
description = "codepath tip 102 summer 2026 - problem sets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "basic"
reportOptionalMemberAccess = "none"
reportReturnType = "none"

executionEnvironments = [
    { root = "week-01/day-01/prob-set-01", extraPaths = [".", "week-01/day-01/prob-set-01"] },
    { root = "week-01/day-01/prob-set-02", extraPaths = [".", "week-01/day-01/prob-set-02"] },
