[project]
name = "codepath-tip102-summer-26"
version = "0.1.0"
description = "codepath tip 102 summer 2026 - problem sets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# repo root on sys.path so any set can `from references import Node/Villager/Player`
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "basic"
reportOptionalMemberAccess = "none"
# One environment PER prob-set (root = the set). Its extraPaths are only itself
# (so `from probNN import fn` resolves to THIS set's probNN, not a same-named
# file in a sibling set) plus "." for `from references import ...`. Lumping
# multiple sets into one env makes duplicate module names (prob06, ...) resolve
# to the wrong file. Add a new row when you add a new prob-set/session-notes dir.
executionEnvironments = [
    { root = "week-01/day-01/prob-set-01", extraPaths = [".", "week-01/day-01/prob-set-01"] },
    { root = "week-01/day-01/prob-set-02", extraPaths = [".", "week-01/day-01/prob-set-02"] },
    { root = "week-01/day-02/session-notes", extraPaths = [".", "week-01/day-02/session-notes"] },
    { root = "week-02/day-01/prob-set-01", extraPaths = [".", "week-02/day-01/prob-set-01"] },
    { root = "week-02/day-01/session-notes", extraPaths = [".", "week-02/day-01/session-notes"] },
    { root = "week-02/day-02/session-notes", extraPaths = [".", "week-02/day-02/session-notes"] },
    { root = "week-03/day-01/prob-set-01", extraPaths = [".", "week-03/day-01/prob-set-01"] },
    { root = "week-03/day-02/prob-set-02", extraPaths = [".", "week-03/day-02/prob-set-02"] },
    { root = "week-04/day-01/prob-set-01", extraPaths = [".", "week-04/day-01/prob-set-01"] },
    { root = "week-04/day-01/session-notes", extraPaths = [".", "week-04/day-01/session-notes"] },
    { root = "week-04/day-02/prob-set-01", extraPaths = [".", "week-04/day-02/prob-set-01"] },
    { root = "week-05/day-01/prob-set-01", extraPaths = [".", "week-05/day-01/prob-set-01"] },
    { root = "week-05/day-01/prob-set-02", extraPaths = [".", "week-05/day-01/prob-set-02"] },
    { root = "week-05/day-01/session-notes", extraPaths = [".", "week-05/day-01/session-notes"] },
    { root = "week-06/day-01/prob-set-01", extraPaths = [".", "week-06/day-01/prob-set-01"] },
    { root = "week-06/day-01/prob-set-02", extraPaths = [".", "week-06/day-01/prob-set-02"] },
    { root = "week-06/day-01/session-notes", extraPaths = [".", "week-06/day-01/session-notes"] },
    { root = "week-06/day-02/prob-set-01", extraPaths = [".", "week-06/day-02/prob-set-01"] },
    { root = "week-07/day-01/prob-set-01", extraPaths = [".", "week-07/day-01/prob-set-01"] },
]
